<h2 mat-dialog-title>Create program</h2>
<mat-dialog-content>
    <mat-form-field>
        <mat-label>Name</mat-label>
        <input matInput [formField]="form" />
    </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
    <button matButton [mat-dialog-close]="undefined">Cancel</button>
    <button matButton="filled" [mat-dialog-close]="form().value()" cdkFocusInitial>Create</button>
</mat-dialog-actions>
